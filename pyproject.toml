[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "morph-ui"
version = "0.1.0"
description = "Build native OpenGL UIs with HTML, CSS, and JavaScript"
requires-python = ">=3.10"
dependencies = [
    "watchdog>=4.0",
    "jinja2>=3.0",
    "click>=8.0",
]

[project.scripts]
morph = "morph.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]
