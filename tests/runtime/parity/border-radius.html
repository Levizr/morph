<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; padding: 8px; background: #0b1220; color: #e2e8f0; font-family: "DejaVu Sans", sans-serif; font-size: 16px; }
.screen { display: flex; flex-direction: column; gap: 16px; padding: 20px; }
.uniform { padding: 16px; background: #16213a; border: 4px solid #ffffff; border-radius: 16px; color: #fff; }
.corners { padding: 16px; background: #16213a; border: 4px solid #ffffff; border-top-left-radius: 4px; border-top-right-radius: 16px; border-bottom-right-radius: 28px; border-bottom-left-radius: 40px; color: #fff; }
.cornercolors { padding: 16px; background: #16213a; border: 6px solid; border-top-color: #ff0000; border-right-color: #00ff00; border-bottom-color: #0000ff; border-left-color: #ffff00; border-top-left-radius: 4px; border-top-right-radius: 16px; border-bottom-right-radius: 28px; border-bottom-left-radius: 40px; color: #fff; }
.cornerdots { padding: 16px; background: #16213a; border: 4px dotted #22d3ee; border-top-left-radius: 4px; border-top-right-radius: 16px; border-bottom-right-radius: 28px; border-bottom-left-radius: 40px; color: #fff; }
.cornerdashes { padding: 16px; background: #16213a; border: 4px dashed #a855f7; border-top-left-radius: 4px; border-top-right-radius: 16px; border-bottom-right-radius: 28px; border-bottom-left-radius: 40px; color: #fff; }
.pill { padding: 16px; background: #16213a; border: 4px solid #ffffff; border-radius: 9999px; color: #fff; }
.fillonly { padding: 16px; background: #16213a; border-radius: 24px; color: #fff; }
</style>
</head>
<body>
<div class="screen">
<div class="uniform">uniform radius</div>
<div class="corners">per-corner radius</div>
<div class="cornercolors">per-corner radius, per-side colors</div>
<div class="cornerdots">per-corner radius, dotted</div>
<div class="cornerdashes">per-corner radius, dashed</div>
<div class="pill">pill clamp</div>
<div class="fillonly">rounded fill, no border</div>
</div>
</body>
</html>
