<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; background: #0b1220; color: #e2e8f0; font-family: "DejaVu Sans", sans-serif; font-size: 16px; }
.screen { display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.tall { height: 120px; padding: 8px; }
.vscroll { background: #16213a; height: 140px; overflow-y: auto; color: #fff; }
.outer { background: #16213a; height: 150px; overflow-y: auto; color: #fff; }
.inner { background: #1f2b4d; height: 90px; overflow-y: auto; margin: 8px; color: #fff; }
.hscroll { background: #16213a; height: 64px; overflow-x: auto; overflow-y: hidden; color: #fff; }
.widerow { display: flex; flex-direction: row; gap: 8px; width: 1000px; padding: 8px; }
.cell { width: 200px; background: #a855f7; padding: 8px; }
.clipbox { background: #16213a; height: 60px; overflow: hidden; color: #fff; }
</style>
</head>
<body>
<div class="screen">
<div class="vscroll"><div class="tall">tall content top</div><div class="tall">tall content mid</div><div class="tall">tall content bottom</div></div>
<div class="outer"><div class="inner"><div class="tall">nested top</div><div class="tall">nested bottom</div></div><div class="tall">outer tail</div></div>
<div class="hscroll"><div class="widerow"><div class="cell">cell one</div><div class="cell">cell two</div><div class="cell">cell three</div><div class="cell">cell four</div></div></div>
<div class="clipbox"><div class="tall">clipped away top</div><div class="tall">clipped away bottom</div></div>
</div>
</body>
</html>
