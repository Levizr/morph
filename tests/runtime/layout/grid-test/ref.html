<!doctype html>
<!-- Browser reference for grid-test. Same stylesheet and DOM as src/App.mx,
     so colored rectangles can be compared geometrically without text. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Grid Test</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="screen">
  <div class="grid">
    <div class="a" id="a"></div>
    <div class="b" id="b"></div>
    <div class="c" id="c"></div>
    <div class="d" id="d"></div>
    <div class="e" id="e"></div>
  </div>
  <div class="grid2">
    <div class="g2a" id="g2a"></div>
    <div class="g2b" id="g2b"></div>
    <div class="g2c" id="g2c"></div>
    <div class="g2d" id="g2d"></div>
    <div class="g2e" id="g2e"></div>
  </div>
  <div class="grid3">
    <div class="g3a" id="g3a"></div>
    <div class="g3b" id="g3b"></div>
    <div class="g3c" id="g3c"></div>
  </div>
</div>
</body>
</html>
