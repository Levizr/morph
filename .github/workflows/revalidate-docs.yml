name: Revalidate Docs Cache

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Build cache tags
        id: tags
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const before = context.payload.before;
            const after = context.payload.after;

            let payloadCommits;

            if (before && after && before !== after) {
              // Push event: diff the pushed range via the API.
              // (context.payload.commits is sometimes empty for pushes, so
              // we never rely on it.)
              const { data } = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: before,
                head: after,
              });
              const files = (data.files || []).filter((f) =>
                f.filename.startsWith("docs/")
              );
              payloadCommits = [
                {
                  id: after,
                  message: context.payload.head_commit?.message || "",
                  added: files
                    .filter((f) => f.status === "added")
                    .map((f) => f.filename),
                  modified: files
                    .filter((f) =>
                      ["modified", "changed", "renamed"].includes(f.status)
                    )
                    .map((f) => f.filename),
                  removed: files
                    .filter((f) => f.status === "removed")
                    .map((f) => f.filename),
                },
              ];
            } else {
              // Manual dispatch: revalidate every doc file.
              const { data } = await github.rest.git.getTree({
                owner,
                repo,
                tree_sha: "main",
                recursive: "true",
              });
              const files = (data.tree || [])
                .filter(
                  (t) => t.type === "blob" && t.path.startsWith("docs/")
                )
                .map((t) => t.path);
              payloadCommits = [
                {
                  id: after || "main",
                  message: "manual revalidation",
                  added: [],
                  modified: files,
                  removed: [],
                },
              ];
            }

            const all = payloadCommits.flatMap((c) => [
              ...(c.added || []),
              ...(c.modified || []),
              ...(c.removed || []),
            ]);

            if (all.length === 0) {
              core.setOutput("skip", "true");
              return;
            }

            core.setOutput("skip", "false");

            // One cache tag per changed/removed/added docs page, matching the
            // tags assigned at render time in lib/github-docs.ts.
            const tags = new Set();
            for (const file of all) {
              const match = file.match(/^docs\/(.+)\.md$/);
              if (match) tags.add(`doc-${match[1]}`);
            }

            const jsonChanged = all.some((f) =>
              /^docs\/.*\.(json|jsonc)$/.test(f)
            );
            const navChanged = payloadCommits.some(
              (c) =>
                (c.added || []).some((f) => f.startsWith("docs/")) ||
                (c.removed || []).some((f) => f.startsWith("docs/"))
            );

            if (jsonChanged || navChanged || tags.size > 0) {
              tags.add("morph-docs-tree");
              tags.add("navigation-menu");
            }

            core.setOutput("tags", JSON.stringify([...tags]));

      - name: Purge Vercel cache by tag
        if: steps.tags.outputs.skip == 'false'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN secret"
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_PROJECT_ID variable"
            exit 1
          fi

          PURGE_URL="https://api.vercel.com/v1/edge-cache/invalidate-by-tags?projectIdOrName=${VERCEL_PROJECT_ID}"
          if [ -n "$VERCEL_TEAM_ID" ]; then
            PURGE_URL="${PURGE_URL}&teamId=${VERCEL_TEAM_ID}"
          fi

          COUNT=$(echo "$TAGS" | jq length)
          echo "Purging $COUNT tag(s) via $PURGE_URL"
          for ((i = 0; i < COUNT; i += 16)); do
            BATCH=$(echo "$TAGS" | jq -c ".[$i:$((i + 16))]")
            echo "Batch $i: $BATCH"
            curl -fsS -X POST "$PURGE_URL" \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"tags\": $BATCH, \"target\": \"production\"}"
            echo
          done
          echo "Vercel cache purged successfully"