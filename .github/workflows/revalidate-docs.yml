name: Revalidate Docs Cache

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Build webhook payload
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const before = context.payload.before;
            const after = context.payload.after;

            let payloadCommits;

            if (before && after && before !== after) {
              // Push event: diff the pushed range via the API.
              // (context.payload.commits is sometimes empty for pushes, so
              // we never rely on it.)
              const { data } = await github.rest.repos.compareCommits({
                owner,
                repo,
                base: before,
                head: after,
              });
              const files = (data.files || []).filter((f) =>
                f.filename.startsWith("docs/")
              );
              payloadCommits = [
                {
                  id: after,
                  message: context.payload.head_commit?.message || "",
                  added: files
                    .filter((f) => f.status === "added")
                    .map((f) => f.filename),
                  modified: files
                    .filter((f) =>
                      ["modified", "changed", "renamed"].includes(f.status)
                    )
                    .map((f) => f.filename),
                  removed: files
                    .filter((f) => f.status === "removed")
                    .map((f) => f.filename),
                },
              ];
            } else {
              // Manual dispatch: revalidate every doc file.
              const { data } = await github.rest.git.getTree({
                owner,
                repo,
                tree_sha: "main",
                recursive: "true",
              });
              const files = (data.tree || [])
                .filter(
                  (t) => t.type === "blob" && t.path.startsWith("docs/")
                )
                .map((t) => t.path);
              payloadCommits = [
                {
                  id: after || "main",
                  message: "manual revalidation",
                  added: [],
                  modified: files,
                  removed: [],
                },
              ];
            }

            const all = payloadCommits.flatMap((c) => [
              ...(c.added || []),
              ...(c.modified || []),
              ...(c.removed || []),
            ]);

            if (all.length === 0) {
              core.setOutput("skip", "true");
              return;
            }

            core.setOutput("skip", "false");
            core.setOutput(
              "payload",
              JSON.stringify({
                ref: context.payload.ref || "refs/heads/main",
                commits: payloadCommits,
              })
            );

      - name: Call revalidation endpoint
        if: steps.payload.outputs.skip == 'false'
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          PAYLOAD: ${{ steps.payload.outputs.payload }}
        run: |
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -binary | xxd -p -c 256)
          curl -fsS -X POST "$REVALIDATE_URL" \
            -H "Content-Type: application/json" \
            -H "x-github-event: push" \
            -H "x-hub-signature-256: sha256=$SIGNATURE" \
            -d "$PAYLOAD"
          echo "Revalidation request sent successfully"
